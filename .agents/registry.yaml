version: 0.1.0
project:
  name: construction-operating-group-plan
  purpose: Build a repeatable blueprint for partnering with, improving, and potentially acquiring owner-operated construction trade businesses.
canonical_files:
  current_facts: .agents/context/current-facts.md
  vision: 00-overview/vision.md
  participants: 00-overview/participants.md
  assumptions: 00-overview/assumptions.md
  open_questions: 00-overview/open-questions.md
  owner_partner_profile: 01-strategy/owner-partner-profile.md
  first_call_script: 01-strategy/first-call-script.md
  kpi_scorecard: 02-operations/kpi-scorecard.md
  baseline_data_request: 04-finance/baseline-data-request.md
  owner_partner_pitch: 05-sales-marketing/owner-partner-pitch.md
  referral_partner_pitch: 05-sales-marketing/referral-partner-pitch.md
  decision_log: 07-execution-plan/decision-log.md
  roadmap: 07-execution-plan/roadmap.md
  launch_plan_30_60_90: 07-execution-plan/30-60-90-launch-plan.md
  readiness_checklist: 07-execution-plan/first-version-readiness-checklist.md
  investor_deck: 08-investor-materials/executive-slide-deck.md
skills:
  - name: business-plan-synthesis
    path: .agents/skills/business-plan-synthesis/SKILL.md
    use_when:
      - turning founder notes into plan sections
      - reconciling related plan files
      - creating a structured business blueprint
  - name: assumption-management
    path: .agents/skills/assumption-management/SKILL.md
    use_when:
      - extracting assumptions
      - validating targets
      - identifying evidence needed
  - name: decision-logging
    path: .agents/skills/decision-logging/SKILL.md
    use_when:
      - a strategic or operating choice is made
      - an option is rejected
      - reversibility matters
  - name: voice-note-processing
    path: .agents/skills/voice-note-processing/SKILL.md
    use_when:
      - processing dictated notes
      - separating ideas from decisions
      - extracting tasks from voice sessions
  - name: agent-orchestration
    path: .agents/skills/agent-orchestration/SKILL.md
    use_when:
      - creating work for multiple agents
      - assigning bounded research streams
      - preventing agents from overlapping writes
  - name: investor-storytelling
    path: .agents/skills/investor-storytelling/SKILL.md
    use_when:
      - creating investor materials
      - writing executive summaries
      - explaining the acquisition platform thesis
  - name: founder-context-ingestion
    path: .agents/skills/founder-context-ingestion/SKILL.md
    use_when:
      - updating the plan with new founder context
      - changing geography, roles, availability, or decisions
      - removing stale conflicting context
  - name: github-readiness-maintenance
    path: .agents/skills/github-readiness-maintenance/SKILL.md
    use_when:
      - preparing the repo for GitHub
      - validating Markdown links
      - converting local paths to relative links
      - checking registry paths
  - name: launch-sequence-maintenance
    path: .agents/skills/launch-sequence-maintenance/SKILL.md
    use_when:
      - updating the 30/60/90 launch plan
      - reviewing launch blockers
      - assigning next actions
      - maintaining readiness gates
  - name: stakeholder-validation
    path: .agents/skills/stakeholder-validation/SKILL.md
    use_when:
      - preparing team validation
      - creating review agendas
      - capturing stakeholder feedback
      - turning feedback into plan updates
